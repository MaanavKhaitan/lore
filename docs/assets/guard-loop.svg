<svg viewBox="0 0 1760 780" xmlns="http://www.w3.org/2000/svg" font-family="Poppins, 'Avenir Next', 'Nunito Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <!-- palette: cream #F7F4EC · slate #35414B · sage #7E9C6F · taupe #CBC1AD · clay #B65C48 · ink #24292D -->
  <defs>
    <marker id="arrowG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0.5,0.8 L9.2,5 L0.5,9.2 Z" fill="#46525C"/>
    </marker>
    <marker id="arrowClay" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0.5,0.8 L9.2,5 L0.5,9.2 Z" fill="#B65C48"/>
    </marker>
    <filter id="softG" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#3A4650" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1760" height="780" fill="#F7F4EC"/>

  <!-- Agent -->
  <rect x="110" y="150" width="250" height="150" rx="20" fill="#FFFFFF" stroke="#DFD7C7" stroke-width="1.5" filter="url(#softG)"/>
  <text x="235" y="233" text-anchor="middle" font-size="22" font-weight="600" fill="#35414B">Agent</text>

  <!-- Entities & rules -->
  <rect x="110" y="460" width="250" height="150" rx="20" fill="#FFFFFF" stroke="#DFD7C7" stroke-width="1.5" filter="url(#softG)"/>
  <text x="235" y="528" text-anchor="middle" font-size="22" font-weight="600" fill="#35414B">Entities &amp; rules</text>
  <rect x="170" y="550" width="130" height="6" rx="3" fill="#CBC1AD"/>
  <rect x="158" y="570" width="155" height="6" rx="3" fill="#CBC1AD"/>

  <!-- Connectors into the guard (drawn before their label pills) -->
  <line x1="372" y1="240" x2="708" y2="300" stroke="#46525C" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowG)"/>
  <line x1="372" y1="520" x2="708" y2="470" stroke="#46525C" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowG)"/>

  <!-- proposed action pill -->
  <rect x="445" y="245" width="190" height="34" rx="17" fill="#EFE7D6" stroke="#E2D8C2" stroke-width="1"/>
  <text x="540" y="268" text-anchor="middle" font-size="15" font-weight="600" fill="#77694F">proposed action</text>

  <!-- compile pill -->
  <rect x="455" y="473" width="170" height="34" rx="17" fill="#EFE7D6" stroke="#E2D8C2" stroke-width="1"/>
  <text x="540" y="496" text-anchor="middle" font-size="15" font-weight="600" fill="#77694F">lore.compile()</text>

  <!-- Guard (ink box) -->
  <rect x="720" y="170" width="320" height="410" rx="20" fill="#24292D" filter="url(#softG)"/>
  <text x="880" y="218" text-anchor="middle" font-size="22" font-weight="600" fill="#F6F3EA">Guard</text>
  <!-- nested checks diamond -->
  <rect x="830" y="255" width="100" height="100" rx="12" fill="#F1EDE2" stroke="#D9D0BC" stroke-width="1.5" transform="rotate(45 880 305)"/>
  <text x="880" y="312" text-anchor="middle" font-size="15" font-weight="600" fill="#35414B">Checks</text>
  <!-- committed facts -->
  <rect x="765" y="430" width="230" height="110" rx="14" fill="#F1EDE2" stroke="#D9D0BC" stroke-width="1.5"/>
  <text x="880" y="472" text-anchor="middle" font-size="15.5" font-weight="600" fill="#35414B">Committed facts</text>
  <rect x="815" y="492" width="130" height="6" rx="3" fill="#CBC1AD"/>
  <rect x="803" y="511" width="155" height="6" rx="3" fill="#CBC1AD"/>
  <!-- checks read facts, commits append facts -->
  <line x1="860" y1="366" x2="860" y2="418" stroke="#B9C0C7" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowG)"/>
  <line x1="900" y1="418" x2="900" y2="366" stroke="#B9C0C7" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowG)"/>

  <!-- Guard to commit -->
  <line x1="1052" y1="320" x2="1466" y2="320" stroke="#46525C" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowG)"/>
  <rect x="1215" y="303" width="64" height="34" rx="17" fill="#E4EBD8" stroke="#7E9C6F" stroke-width="1"/>
  <text x="1247" y="326" text-anchor="middle" font-size="15" font-weight="600" fill="#46603C">ok</text>

  <!-- Commit -->
  <circle cx="1544" cy="320" r="64" fill="#7E9C6F" filter="url(#softG)"/>
  <text x="1544" y="328" text-anchor="middle" font-size="21" font-weight="600" fill="#FCFBF6">Commit</text>

  <!-- Rejection loop: guard to repair prompt, back to the agent -->
  <line x1="880" y1="584" x2="880" y2="638" stroke="#B65C48" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowClay)"/>
  <rect x="755" y="645" width="250" height="70" rx="16" fill="#FFFFFF" stroke="#B65C48" stroke-width="2" filter="url(#softG)"/>
  <text x="880" y="688" text-anchor="middle" font-size="18" font-weight="600" fill="#8F4636">Repair prompt</text>
  <path d="M 750 680 L 265 680 Q 235 680 235 650 L 235 312" fill="none" stroke="#B65C48" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowClay)"/>
</svg>
