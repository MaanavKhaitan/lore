[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ontic"
version = "0.1.0"
description = "Deterministic ontology guardrails for agent outputs — Pydantic validates the shape of one object; ontic validates whether your agent's outputs make sense in your world."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Maanav Khaitan", email = "maanav@infiniteworlds.xyz" }]
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
pydantic-ai = ["pydantic-ai>=0.2"]
anthropic = ["anthropic>=1.0"]

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "pydantic-ai>=0.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/ontic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
